<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient & Patterns -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3d3835" />
      <stop offset="50%" stop-color="#282422" />
      <stop offset="100%" stop-color="#141312" />
    </radialGradient>

    <!-- Warm Face Light -->
    <linearGradient id="faceGrad" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#d99f82" />
      <stop offset="40%" stop-color="#c98a6c" />
      <stop offset="85%" stop-color="#a86d52" />
      <stop offset="100%" stop-color="#8a533b" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d221e" />
      <stop offset="50%" stop-color="#1c1513" />
      <stop offset="100%" stop-color="#0f0c0b" />
    </linearGradient>

    <!-- Vest & Shirt Gradients -->
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a5d64" />
      <stop offset="50%" stop-color="#43464c" />
      <stop offset="100%" stop-color="#2d2f33" />
    </linearGradient>

    <linearGradient id="trimLime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2f14e" />
      <stop offset="100%" stop-color="#b6c928" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGlow)" />

  <!-- Background Wall Vertical Texture Lines -->
  <g opacity="0.25" stroke="#100e0d" stroke-width="2.5">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="70" y1="0" x2="70" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="130" y1="0" x2="130" y2="400" />
    <line x1="270" y1="0" x2="270" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="330" y1="0" x2="330" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
  </g>

  <!-- Shoulders / Torso Base -->
  <!-- Black T-shirt Body -->
  <path d="M 120 220 C 130 200 270 200 280 220 L 320 330 C 330 380 330 400 330 400 L 70 400 C 70 400 70 380 80 330 Z" fill="#18181a" />

  <!-- "POWERFUL" Graphic on Shirt -->
  <g transform="translate(200, 310)" text-anchor="middle">
    <text y="-22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8" fill="#a0a5ad" letter-spacing="2">BECOME MORE</text>
    <text y="0" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="28" fill="#e2f14e" letter-spacing="1">POWERFUL</text>
  </g>

  <!-- Gray Vest Left Side -->
  <path d="M 80 330 C 75 250 110 215 138 215 C 145 235 152 280 148 340 C 144 380 135 400 130 400 L 70 400 Z" fill="url(#vestGrad)" />
  <!-- Neon Trim Left -->
  <path d="M 138 215 C 145 235 152 280 148 340 C 146 370 140 400 136 400 L 131 400 C 135 370 140 340 141 280 C 142 245 136 220 133 215 Z" fill="url(#trimLime)" />

  <!-- Gray Vest Right Side -->
  <path d="M 320 330 C 325 250 290 215 262 215 C 255 235 248 280 252 340 C 256 380 265 400 270 400 L 330 400 Z" fill="url(#vestGrad)" />
  <!-- Neon Trim Right -->
  <path d="M 262 215 C 255 235 248 280 252 340 C 254 370 260 400 264 400 L 269 400 C 265 370 260 340 259 280 C 258 245 264 220 267 215 Z" fill="url(#trimLime)" />

  <!-- Neck -->
  <path d="M 172 175 L 172 230 C 172 248 228 248 228 230 L 228 175 Z" fill="#9e6248" />
  <!-- Neck Shadow / Highlight -->
  <path d="M 175 180 C 190 200 210 200 225 180 L 225 200 C 210 215 190 215 175 200 Z" fill="#7a4632" opacity="0.6" />

  <!-- Head & Face Base -->
  <path d="M 148 120 C 148 68 252 68 252 120 C 252 170 236 195 200 198 C 164 195 148 170 148 120 Z" fill="url(#faceGrad)" />

  <!-- Ears -->
  <path d="M 148 118 C 142 118 138 128 140 142 C 142 152 147 155 151 150 Z" fill="#b87b5f" />
  <path d="M 252 118 C 258 118 262 128 260 142 C 258 152 253 155 249 150 Z" fill="#b87b5f" />

  <!-- Eyes and Eyebrows -->
  <!-- Left Eyebrow -->
  <path d="M 166 112 C 175 107 187 108 191 112 C 187 115 175 114 166 112 Z" fill="#1a1412" />
  <!-- Right Eyebrow -->
  <path d="M 234 112 C 225 107 213 108 209 112 C 213 115 225 114 234 112 Z" fill="#1a1412" />

  <!-- Eyes -->
  <ellipse cx="178" cy="122" rx="6.5" ry="4.5" fill="#f8f4f0" />
  <circle cx="178.5" cy="122" r="3.2" fill="#2d1c15" />
  <circle cx="179.5" cy="121" r="1" fill="#ffffff" />

  <ellipse cx="222" cy="122" rx="6.5" ry="4.5" fill="#f8f4f0" />
  <circle cx="221.5" cy="122" r="3.2" fill="#2d1c15" />
  <circle cx="222.5" cy="121" r="1" fill="#ffffff" />

  <!-- Nose -->
  <path d="M 197 116 L 195 142 C 195 146 205 146 205 142 L 203 116" fill="none" stroke="#94573e" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="194" cy="143" rx="2.5" ry="1.5" fill="#753f2a" />
  <ellipse cx="206" cy="143" rx="2.5" ry="1.5" fill="#753f2a" />

  <!-- Full Neat Beard & Mustache -->
  <!-- Mustache -->
  <path d="M 183 150 C 193 147 200 152 200 152 C 200 152 207 147 217 150 C 215 158 204 158 200 155 C 196 158 185 158 183 150 Z" fill="#1f1816" />
  <!-- Lips -->
  <path d="M 188 156 C 195 158 205 158 212 156" stroke="#8a4738" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Full Beard Contour -->
  <path d="M 152 135 C 150 162 165 196 200 198 C 235 196 250 162 248 135 C 242 155 230 186 200 186 C 170 186 158 155 152 135 Z" fill="#1a1412" opacity="0.95" />
  <!-- Beard Texture Strands -->
  <path d="M 160 152 C 168 182 190 194 200 195 C 210 194 232 182 240 152 C 236 172 220 188 200 188 C 180 188 164 172 160 152 Z" fill="#120e0d" />

  <!-- Hair (Short, Modern Textured Style) -->
  <path d="M 146 115 C 144 80 155 46 182 40 C 205 35 230 42 246 54 C 256 68 256 95 254 115 C 250 95 244 80 234 76 C 220 72 208 78 190 74 C 172 70 156 82 146 115 Z" fill="url(#hairGrad)" />
  <path d="M 172 45 C 188 40 210 42 228 50 C 215 48 196 48 178 54 Z" fill="#3a2e29" opacity="0.8" />
  <path d="M 150 90 C 158 75 174 65 196 64 C 182 68 168 76 158 90 Z" fill="#3a2e29" opacity="0.6" />
</svg>
